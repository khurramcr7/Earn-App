allowBuilds:
  '@medusajs/telemetry': true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
# Medusa's admin build needs these packages visible at the top of node_modules
# (pnpm 11 reads this here instead of .npmrc).
publicHoistPattern:
  - '*@medusajs/*'
  - '@tanstack/react-query'
  - react-i18next
  - react-router-dom
